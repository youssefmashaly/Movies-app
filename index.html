<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Database</title>
    <meta name="description" content="Movie Database helps you discover films you'll love. Browse trending movies, build your watchlist, read community reviews, and get AI-powered recommendations." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Phase 55: Exactly 4 preconnects (Lighthouse warns above 4).
         Chosen for highest LCP impact:
         - image.tmdb.org     → hero backdrop + poster images (immediate)
         - fonts.gstatic.com  → font file downloads
         - firebaseapp.com    → Firebase auth iframe (430ms LCP savings per Lighthouse)
         - apis.google.com    → Firebase token validation (380ms LCP savings)
         Removed: www.googleapis.com, securetoken.googleapis.com -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://gen-lang-client-0351664131.firebaseapp.com" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />

    <!-- DNS prefetch for remaining Google origins — cheaper than preconnect,
         still reduces lookup time without triggering the >4 warning -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />

    <!-- Non-blocking font load. Moved from CSS @import in Phase 54.
         Reduced to only weights actually used in the app.
         JetBrains Mono removed — never referenced in any component. -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap"
          media="print"
          onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
